<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100E0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="미나의 하루">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=3" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<title>미나의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
/* Layout: phone = one column + floating tab bar; ≥960px = quiet left rail + wide content.
   Look: neutral paper ground, hairline-bordered white surfaces, ink type, one evergreen accent. */
:root{
  --bg:#F6F4F5; --card:#FFFFFF; --sunken:#EFECEE; --soft:#FAF8F9; --line:#E8E3E6; --line2:#D9D2D6;
  --fg:#1A1418; --fg2:#5A5157; --fg3:#7B7178; --fg4:#A69CA2; --ring:#C9C0C5;
  --accent:#F2357E; --accent-ink:#C21864; --accent-weak:#FFE6EF; --on-accent:#FFFFFF;
  --red:#C2362B; --red-weak:#FBEAE7; --sat:#2B5FB8;
  --violet:#6B3FC4; --violet-weak:#F0EAFB; --violet-dot:#8B63E0;
  --green:#1E6B57; --green-weak:#E2EFE9; --green-dot:#2E9A7C;
  --orange:#9A4A0B; --orange-weak:#FBEFE3; --orange-dot:#E07B2A;
  --blue:#2B5FB8; --blue-weak:#E7EEFA; --blue-dot:#3A73D6;
  --star:#D99A1E; --scrim:rgba(14,18,16,.42); --glass:rgba(255,255,255,.86);
  --ff:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --r:18px; --r-ctl:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100E0F; --card:#1A1719; --sunken:#242023; --soft:#1D1A1C; --line:#2E292C; --line2:#3B3539;
  --fg:#EEF1EE; --fg2:#B2B9B4; --fg3:#949B96; --fg4:#6E7570; --ring:#4A514C;
  --accent:#FF5C9E; --accent-ink:#FF8CB8; --accent-weak:#3A1626; --on-accent:#FFFFFF;
  --red:#FF7A6E; --red-weak:#3A1D1A; --sat:#82A8F0;
  --violet:#C3A6FF; --violet-weak:#2A2340; --violet-dot:#A786F5;
  --green:#86D6BC; --green-weak:#16302A; --green-dot:#4FBF9C;
  --orange:#FFB27A; --orange-weak:#382616; --orange-dot:#F0904A;
  --blue:#9CBBF5; --blue-weak:#1B2742; --blue-dot:#6C98EC;
  --star:#F0BE55; --scrim:rgba(0,0,0,.6); --glass:rgba(22,25,23,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100E0F; --card:#1A1719; --sunken:#242023; --soft:#1D1A1C; --line:#2E292C; --line2:#3B3539;
  --fg:#EEF1EE; --fg2:#B2B9B4; --fg3:#949B96; --fg4:#6E7570; --ring:#4A514C;
  --accent:#FF5C9E; --accent-ink:#FF8CB8; --accent-weak:#3A1626; --on-accent:#FFFFFF;
  --red:#FF7A6E; --red-weak:#3A1D1A; --sat:#82A8F0;
  --violet:#C3A6FF; --violet-weak:#2A2340; --violet-dot:#A786F5;
  --green:#86D6BC; --green-weak:#16302A; --green-dot:#4FBF9C;
  --orange:#FFB27A; --orange-weak:#382616; --orange-dot:#F0904A;
  --blue:#9CBBF5; --blue-weak:#1B2742; --blue-dot:#6C98EC;
  --star:#F0BE55; --scrim:rgba(0,0,0,.6); --glass:rgba(22,25,23,.86); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* tab bar: floating glass pill */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;z-index:20;max-width:520px;margin:0 auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;color:var(--fg4);font-size:10.5px;font-weight:600;letter-spacing:0;transition:color .15s,background .15s}
.tab[aria-current="page"]{color:var(--fg);background:var(--sunken)}
.tab svg,.nav svg{width:22px;height:22px}

/* desktop rail */
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:2px;width:236px;flex-shrink:0;padding:36px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  .brand{font-size:15px;font-weight:700;padding:0 12px 28px;display:flex;align-items:center;gap:10px}
  .brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:block}
  .nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--fg2);font-size:15px;font-weight:500;transition:background .15s,color .15s}
  .nav:hover{background:var(--sunken);color:var(--fg)}
  .nav[aria-current="page"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
  .tabbar{display:none}
  .main{padding:40px 40px 72px}
  .wrap{max-width:1080px;gap:18px}
  .fab{right:40px!important;bottom:40px!important}
}

/* type */
.h-sub{font-size:14px;font-weight:500;color:var(--fg3)}
.h-big{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.035em;text-wrap:balance}
.h-page{font-size:26px;font-weight:700;letter-spacing:-.035em}
.head{padding:0 2px 10px;display:flex;flex-direction:column;gap:6px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 4px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flush{padding:6px 0;gap:0}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-title b{font-size:13px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.link{font-size:13px;color:var(--fg3);font-weight:500;transition:color .15s}
.link:hover{color:var(--fg)}
.muted{color:var(--fg3)}
.empty{font-size:14px;color:var(--fg3);padding:2px 0}
.dot{width:7px;height:7px;border-radius:4px;flex-shrink:0}
.ev{display:flex;align-items:center;gap:12px;width:100%;min-height:30px}
.ev .t{font-family:var(--fm);font-size:12.5px;color:var(--fg3);width:44px;flex-shrink:0;letter-spacing:0}
.ev .n{font-size:15.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .note{font-size:12px;color:var(--fg3);flex-shrink:0}
.pill{font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:0;padding:4px 8px;border-radius:8px;flex-shrink:0;color:var(--fg2);border:1px solid var(--line)}
.pill.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.past{color:var(--fg4)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;flex-shrink:0}
.k-birth{background:var(--violet-weak);color:var(--violet)}
.k-card{background:var(--blue-weak);color:var(--blue)}
.k-renew{background:var(--green-weak);color:var(--green)}
.k-etc{background:var(--orange-weak);color:var(--orange)}
.c-blue{background:var(--blue-dot)} .c-green{background:var(--green-dot)} .c-orange{background:var(--orange-dot)} .c-violet{background:var(--violet-dot)} .c-red{background:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tap{transition:transform .1s,background .15s,border-color .15s}
.tap:active{transform:scale(.99)}
button.card:hover,button.mini:hover,.memo:hover{border-color:var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:17px;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--fg2);transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.soft{background:transparent}
.chip.soft[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-ink)}
.seg{background:var(--sunken);border-radius:12px;padding:3px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.seg button{height:36px;border-radius:9px;text-align:center;font-size:14px;font-weight:500;color:var(--fg3);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.iconbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--fg2);transition:background .15s}
.iconbtn:hover{background:var(--sunken)}
.btn{height:50px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:600;text-align:center;padding:0 20px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:default}
.btn.ghost{background:var(--sunken);color:var(--fg2)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{height:36px;border-radius:10px;font-size:14px;padding:0 14px}
.quick{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 14px;background:var(--soft);transition:border-color .15s}
.quick:focus-within{border-color:var(--accent)}
.quick input{flex:1;min-width:0;border:0;background:transparent;font-size:14.5px;height:38px;outline:none}
.quick .btn{background:var(--accent);color:var(--on-accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* check rows */
.item{display:flex;align-items:center;gap:14px;padding:11px 20px;min-height:54px;width:100%;border-top:1px solid var(--soft)}
.check{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ring);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-accent);transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.check.sq{border-radius:6px}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px;opacity:0}
.check.on svg{opacity:1}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
.item .txt b{font-size:15.5px;font-weight:500;overflow-wrap:anywhere}
.item .txt small{font-size:12.5px;color:var(--fg3)}
.item.done .txt b{color:var(--fg4);text-decoration:line-through;text-decoration-thickness:1px}
.group-label{padding:14px 20px 6px;font-size:12px;font-weight:600;color:var(--fg3);letter-spacing:.04em;display:flex;justify-content:space-between}
.star{color:var(--star)}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.wd{text-align:center;font-size:11.5px;font-weight:500;color:var(--fg3);padding-bottom:8px}
.wd.sun{color:var(--red)} .wd.sat{color:var(--sat)}
.day{height:54px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px;border-radius:12px;min-width:0}
.day .dn{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;transition:background .15s,color .15s}
.day.sun .dn,.day.hol .dn{color:var(--red)}
.day.sat .dn{color:var(--sat)}
.day.today .dn{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-ink);font-weight:700}
.day.sel .dn{background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:none}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:3px;display:block}
.day .chiplist{display:none}
@media (min-width:960px){
  .cal{padding:16px}
  .cal-grid{gap:0}
  .cal-grid + .cal-grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .day{height:112px;align-items:stretch;padding:6px;gap:3px;border-radius:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .15s}
  .day .dn{width:26px;height:26px;font-size:13px}
  .day .dots{display:none}
  .day .chiplist{display:flex;flex-direction:column;gap:3px;min-width:0}
  .day .chiplist span{font-size:11px;font-weight:500;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day:hover{background:var(--soft)}
  .day.sel{background:var(--soft)}
  .day.blank:hover{background:transparent}
  .cal-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start}
}
.cal-wrap{display:flex;flex-direction:column;gap:14px}
@media (min-width:960px){.cal-wrap{display:grid}}
.ch-ev{background:var(--blue-weak);color:var(--blue)}
.ch-hol{background:var(--red-weak);color:var(--red)}

/* home */
.home-grid{display:flex;flex-direction:column;gap:14px}
.home-col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:960px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
  .home-col{gap:18px}
}
.bar{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.stat{font-size:24px;font-weight:700;letter-spacing:-.03em}
.mini{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;min-width:0}
.notice{border:1px dashed var(--line2);color:var(--fg2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:500}
.notice span{flex:1}
.notice button{font-weight:600;color:var(--accent-ink);white-space:nowrap}

/* year */
.year-list .mrow{display:flex;gap:14px;padding:14px 20px;border-top:1px solid var(--soft)}
.year-list .mrow:first-child{border-top:0}
.mlabel{width:38px;flex-shrink:0;font-family:var(--fm);font-size:13px;font-weight:500;padding-top:2px;color:var(--fg2);letter-spacing:0}
.mlabel.cur{color:var(--accent)} .mlabel.none{color:var(--fg4)}
.mitems{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.yitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.yitem .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.yitem .top{display:flex;align-items:center;gap:7px;min-width:0}
.yitem .top b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yitem small{font-size:12.5px;color:var(--fg3)}
.lunar-note{color:var(--violet);font-weight:500}
@media (min-width:960px){
  .year-list{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:transparent!important;border:0!important;padding:0!important}
  .year-list .mrow{flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:150px}
  .year-list .mrow:first-child{border-top:1px solid var(--line)}
}

/* memos */
.memo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:960px){.memo-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.memo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:148px;text-align:left;min-width:0}
.memo b{font-size:15.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.memo p{margin:0;font-size:13px;color:var(--fg2);line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.memo small{font-size:11.5px;color:var(--fg4)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--fg4);transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:transparent;height:44px;font-size:14.5px;outline:none;min-width:0}

/* fab */
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:17px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(242,53,126,.32);z-index:15;transition:transform .12s}
.fab:active{transform:scale(.92)}
.fab svg{width:24px;height:24px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease-out}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:960px){.sheet-wrap{justify-content:center}.sheet{border-radius:22px;padding:26px;border:1px solid var(--line)}.grab{display:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--ring);align-self:center}
.sheet h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.03em}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lab{font-size:12.5px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.inp{height:48px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:0 14px;font-size:15.5px;width:100%;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:150px;padding:12px 14px;resize:none;line-height:1.6}
select.inp{font-weight:500;appearance:auto}
.preview{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.preview .ph{font-size:12.5px;font-weight:600;color:var(--violet)}
.preview .pl{font-size:14.5px;font-weight:500}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.colors{display:flex;gap:10px}
.colors button{width:32px;height:32px;border-radius:16px}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--fg)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:960px){.toast{bottom:40px}}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.setlist{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--soft);width:100%;cursor:pointer;font-size:15px;font-weight:500}
.setrow small{display:block;font-size:12.5px;color:var(--fg3);font-weight:400;margin-top:2px}
.setrow span{flex:1}
.fine{font-size:12.5px;color:var(--fg3);line-height:1.6;margin:0}
.iconbtn{position:relative}
.badge{position:absolute;top:8px;right:7px;width:8px;height:8px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.sync{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.sync b{font-size:15px;font-weight:600}
.sync .who{display:flex;align-items:center;gap:10px}
.sync .who span{flex:1;min-width:0;font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.sync .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg3)}
.sync .st i{width:7px;height:7px;border-radius:4px;background:var(--fg4)}
.sync .st.on i{background:#2E9A7C}.sync .st.err i{background:var(--red)}
.sync .btn.google{background:var(--accent);color:var(--on-accent)}
.textlink{font-size:13px;color:var(--fg3);text-align:center;padding:6px;text-decoration:underline;text-underline-offset:3px}
.toast{white-space:normal!important;max-width:calc(100% - 32px);text-align:center;width:max-content}
</style>
</head>
<body>

<div class="app">
  <aside class="side" aria-label="메뉴">
    <div class="brand"><i></i>미나의 하루</div>
    <button class="nav" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button class="nav" data-go="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>캘린더</button>

    <button class="nav" data-go="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>연간 일정</button>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
  <nav class="tabbar" aria-label="탭">
    <button class="tab" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button class="tab" data-go="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>캘린더</button>
    <button class="tab" data-go="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.8 1.8L9 5M4 14.5l1.8 1.8L9 13M12.5 7h7.5M12.5 15h7.5"/></svg>리스트</button>
    <button class="tab" data-go="memo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>아이디어</button>
    <button class="tab" data-go="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>연간</button>

  <button class="fab" id="fab" aria-label="추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
/* ================= 날짜 · 음력 ================= */
var WD=['일','월','화','수','목','금','토'];
function pad(n){return (n<10?'0':'')+n}
function iso(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function parse(s){var p=s.split('-');return {y:+p[0],m:+p[1],d:+p[2]}}
function utc(y,m,d){return Date.UTC(y,m-1,d)}
function fromUtc(t){var x=new Date(t);return {y:x.getUTCFullYear(),m:x.getUTCMonth()+1,d:x.getUTCDate()}}
function dow(y,m,d){return new Date(utc(y,m,d)).getUTCDay()}
function addDays(s,n){var p=parse(s),r=fromUtc(utc(p.y,p.m,p.d)+n*864e5);return iso(r.y,r.m,r.d)}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function nowLocal(){var x=new Date();return {y:x.getFullYear(),m:x.getMonth()+1,d:x.getDate(),h:x.getHours()}}
var NOW=nowLocal(), TODAY=iso(NOW.y,NOW.m,NOW.d), T0=utc(NOW.y,NOW.m,NOW.d);
function diff(s){var p=parse(s);return Math.round((utc(p.y,p.m,p.d)-T0)/864e5)}
function md(s){var p=parse(s);return p.m+'월 '+p.d+'일 ('+WD[dow(p.y,p.m,p.d)]+')'}
function short(s){var p=parse(s);return p.m+'.'+p.d}

var DF=null; try{DF=new Intl.DateTimeFormat('en-u-ca-dangi',{month:'numeric',day:'numeric',timeZone:'UTC'})}catch(e){}
var LT={};
function lunarTable(y){
  if(LT[y])return LT[y];
  var a=[];
  for(var t=Date.UTC(y,0,1);t<Date.UTC(y+1,0,1);t+=864e5){
    var x=new Date(t),lm='',ld=0;
    if(DF){var p=DF.formatToParts(x);for(var i=0;i<p.length;i++){if(p[i].type==='month')lm=p[i].value;if(p[i].type==='day')ld=+p[i].value}}
    a.push({iso:iso(y,x.getUTCMonth()+1,x.getUTCDate()),lm:lm,ld:ld});
  }
  return LT[y]=a;
}
function lunarToSolar(y,lm,ld){return lunarTable(y).filter(function(r){return r.lm===String(lm)&&r.ld===ld}).map(function(r){return r.iso})}

/* 한국 공휴일 (음력 명절 자동 계산 + 대체공휴일) */
var HC={};
function holidays(y){
  if(HC[y])return HC[y];
  var H={},sub=[];
  function add(s,n){if(!H[s])H[s]=n}
  [['01-01','신정'],['03-01','삼일절',1],['05-05','어린이날',1],['06-06','현충일'],['08-15','광복절',1],['10-03','개천절',1],['10-09','한글날',1],['12-25','성탄절',1]]
    .forEach(function(h){var s=y+'-'+h[0];add(s,h[1]);if(h[2])sub.push({days:[s],sat:true})});
  var sl=lunarToSolar(y,1,1)[0];
  if(sl){add(addDays(sl,-1),'설날 연휴');add(sl,'설날');add(addDays(sl,1),'설날 연휴');sub.push({days:[addDays(sl,-1),sl,addDays(sl,1)],sat:false})}
  var bd=lunarToSolar(y,4,8)[0]; if(bd){add(bd,'부처님오신날');sub.push({days:[bd],sat:true})}
  var cs=lunarToSolar(y,8,15)[0];
  if(cs){add(addDays(cs,-1),'추석 연휴');add(cs,'추석');add(addDays(cs,1),'추석 연휴');sub.push({days:[addDays(cs,-1),cs,addDays(cs,1)],sat:false})}
  var count={};Object.keys(H).forEach(function(k){count[k]=1});
  sub.forEach(function(g){
    var need=g.days.some(function(s){var p=parse(s),w=dow(p.y,p.m,p.d);return w===0||(g.sat&&w===6)});
    if(!need)return;
    var s=g.days[g.days.length-1];
    for(var i=0;i<10;i++){s=addDays(s,1);var p=parse(s),w=dow(p.y,p.m,p.d);if(w!==0&&w!==6&&!H[s]){H[s]='대체공휴일';break}}
  });
  return HC[y]=H;
}
function holidayOn(s){return holidays(parse(s).y)[s]||''}

/* ================= 데이터 ================= */
var COLS=['events','todos','buys','memos','annual'];
var S={events:[],todos:[],buys:[],memos:[],annual:[]};
var db=null, loaded=false;
var KIND={birth:{label:'생일',cls:'k-birth',dot:'c-violet'},card:{label:'연회비',cls:'k-card',dot:'c-blue'},renew:{label:'갱신',cls:'k-renew',dot:'c-green'},etc:{label:'기념일',cls:'k-etc',dot:'c-orange'}};
var TAGS=['아이디어','여행','읽을거리','기타'];
var TAGCLS={'아이디어':'k-card','여행':'k-renew','읽을거리':'k-etc','기타':'k-birth'};
var CATS=['마트','생활용품','온라인','기타'];
var COLORS=[['blue','c-blue'],['green','c-green'],['orange','c-orange'],['violet','c-violet'],['red','c-red']];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function put(col,item){
  var arr=S[col].filter(function(x){return x.id!==item.id});arr.push(item);S[col]=arr;render();
  save();if(user&&fsdb){cloudCol(col).doc(item.id).set(clean(item)).catch(dbFail)}
}
function del(col,id){
  S[col]=S[col].filter(function(x){return x.id!==id});render();
  save();if(user&&fsdb){cloudCol(col).doc(id).delete().catch(dbFail)}
}
function clean(o){var r={};for(var k in o)if(k!=='id'&&o[k]!==undefined)r[k]=o[k];return r}
function dbFail(e){toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요. 오래된 항목을 지워주세요.':'저장하지 못했어요. 잠시 후 다시 해주세요.')}

/* ================= 화면 상태 ================= */
var V=lsGet('mina-view',{tab:'home',seg:'todo',memoTag:'전체',yearFilter:'all'});
var cal={y:NOW.y,m:NOW.m,sel:TODAY};
var yearSel=NOW.y, memoQuery='', showDone=false;
function go(tab){V.tab=tab;lsSet('mina-view',V);render();window.scrollTo(0,0)}

/* ================= 유틸 ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function won(n){return '₩'+Number(n||0).toLocaleString('ko-KR')}
function ddayLabel(n){return n===0?'오늘':(n>0?'D-'+n:'지남')}
function ddayCls(n){return n<0?'pill past':(n<=7?'pill hot':'pill')}
var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICON_L='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
var ICON_R='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var ICON_STAR=function(on){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.3 6L12 16.4 6.6 19.4l1.3-6L3.4 9.3l6-.7z"/></svg>'};

/* 반복 일정 */
function eventOn(e,s){
  if(s<e.date)return false;
  var r=e.repeat||'none';
  if(r==='none')return e.date===s;
  var a=parse(e.date),b=parse(s);
  if(r==='weekly')return dow(a.y,a.m,a.d)===dow(b.y,b.m,b.d);
  if(r==='monthly')return a.d===b.d;
  if(r==='yearly')return a.m===b.m&&a.d===b.d;
  return false;
}
function eventsOn(s){return S.events.filter(function(e){return eventOn(e,s)}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'')})}
/* 연간 항목 → 해당 연도의 양력 날짜 */
function occ(a,y){
  if(isLunar(a))return lunarToSolar(y,a.m,a.d);
  return a.d<=dim(y,a.m)?[iso(y,a.m,a.d)]:[];
}
function annualYear(y){
  var out=[];S.annual.forEach(function(a){occ(a,y).forEach(function(s){out.push({a:a,date:s,n:diff(s)})})});
  return out.sort(function(x,z){return x.date<z.date?-1:1});
}
function annualOn(s){return annualYear(parse(s).y).filter(function(o){return o.date===s})}
function upcoming(k){return annualYear(NOW.y).concat(annualYear(NOW.y+1)).filter(function(o){return o.n>=0}).slice(0,k)}
function isLunar(a){return a.kind==='birth'&&a.cal==='lunar'}
function annualSub(o){var a=o.a;return md(o.date)+(isLunar(a)?' · <span class="lunar-note">음력 생일</span>':'')+(a.amount?' · '+won(a.amount):'')}

/* ================= 렌더 ================= */
var view=document.getElementById('view');
function render(){
  document.querySelectorAll('[data-go]').forEach(function(b){if(b.dataset.go===V.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  var act=document.activeElement,aid=act&&act.id&&view.contains(act)?act.id:null,sel=aid&&act.selectionStart!=null?[act.selectionStart,act.selectionEnd]:null;
  var html={home:homeV,cal:calV,list:listV,memo:memoV,year:yearV}[V.tab]();
  view.innerHTML=html;
  if(aid){var el=document.getElementById(aid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

function sampleNotice(){
  var n=0;COLS.forEach(function(c){n+=S[c].filter(function(x){return x.sample}).length});
  if(!n)return '';
  return '<div class="notice"><span>지금 보이는 내용은 예시예요. 써보신 뒤 지우고 시작하세요.</span><button data-act="clear-sample">예시 지우기</button></div>';
}

function homeV(){
  var greet=NOW.h<11?'좋은 아침이에요':(NOW.h<17?'좋은 오후예요':'오늘도 수고했어요');
  var hol=holidayOn(TODAY),evs=eventsOn(TODAY),ann=annualOn(TODAY);
  var todayRows='';
  if(hol)todayRows+='<div class="ev"><span class="dot c-red"></span><span class="t">종일</span><span class="n">'+esc(hol)+'</span></div>';
  ann.forEach(function(o){todayRows+='<div class="ev"><span class="dot '+KIND[o.a.kind].dot+'"></span><span class="t">종일</span><span class="n">'+esc(o.a.name)+'</span></div>'});
  evs.forEach(function(e){todayRows+='<div class="ev"><span class="dot '+colorCls(e.color)+'"></span><span class="t num">'+(e.time||'종일')+'</span><span class="n">'+esc(e.title)+'</span></div>'});
  if(!todayRows)todayRows='<div class="empty">오늘은 일정이 없어요</div>';
  var cnt=evs.length+ann.length+(hol?1:0);

  var up=upcoming(4).map(function(o){var k=KIND[o.a.kind]||KIND.etc;
    return '<button class="yitem tap" data-edit-annual="'+o.a.id+'"><span class="tag '+k.cls+'">'+k.label+'</span><span class="txt"><span class="top"><b>'+esc(o.a.name)+'</b></span><small>'+annualSub(o)+'</small></span><span class="'+ddayCls(o.n)+' num">'+ddayLabel(o.n)+'</span></button>'}).join('')||'<div class="empty">연간 탭에서 생일이나 연회비를 추가해 보세요</div>';

  var open=S.todos.filter(function(t){return !t.done}).sort(todoSort),done=S.todos.length-open.length;
  var pct=S.todos.length?Math.round(done/S.todos.length*100):0;
  var topTodos=open.slice(0,4).map(todoRow).join('')||'<div class="empty" style="padding:4px 20px 12px">할 일을 다 끝냈어요</div>';
  var buysLeft=S.buys.filter(function(b){return !b.done});
  var bp=buysLeft.slice(0,3).map(function(b){return esc(b.text)}).join(', ')+(buysLeft.length>3?' 외 '+(buysLeft.length-3)+'개':'');
  var memos=S.memos.slice().sort(memoSort).slice(0,3).map(function(m){
    return '<button class="tap" data-edit-memo="'+m.id+'" style="display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:var(--soft);border-radius:14px;width:100%"><b style="font-size:15px;font-weight:700">'+esc(m.title||'제목 없음')+'</b><small class="muted" style="font-size:13px">'+esc(m.tag)+' · '+ago(m.updatedAt)+'</small></button>'}).join('')||'<div class="empty">떠오른 생각을 적어두세요</div>';

  var p=parse(TODAY);
  return sampleNotice()+
  '<div class="head-row"><div class="head"><span class="h-sub">'+greet+', 미나님</span><span class="h-big num">'+p.m+'월 '+p.d+'일 '+WD[dow(p.y,p.m,p.d)]+'요일</span></div><button class="iconbtn" data-act="settings" aria-label="설정과 백업">'+(user?'':'<i class="badge" aria-hidden="true"></i>')+'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>'+

function signInGoogle(){
  if(!cloudReady){toast('인터넷 연결을 확인해 주세요.');return}
  var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  firebase.auth().signInWithPopup(p).catch(function(e){
    var c=e&&e.code;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'||c==='auth/web-storage-unsupported'){firebase.auth().signInWithRedirect(p).catch(authErr);return}
    authErr(e);
  });
}
function emailAuth(create){
  var em=(document.getElementById('f-email')||{}).value||'',pw=(document.getElementById('f-pw')||{}).value||'';
  em=em.trim(); if(!em||!pw){toast('이메일과 비밀번호를 입력해 주세요.');return}
  var a=firebase.auth();
  (create?a.createUserWithEmailAndPassword(em,pw):a.signInWithEmailAndPassword(em,pw)).catch(authErr);
}
function migrateLocal(){
  var key='mina-migrated-'+user.uid; if(lsGet(key,false))return Promise.resolve();
  var local={};COLS.forEach(function(c){local[c]=S[c].filter(function(x){return !x.sample})});
  return Promise.all(COLS.map(function(c){
    return cloudCol(c).get().then(function(snap){
      var have={};snap.docs.forEach(function(d){have[d.id]=1});
      var bt=fsdb.batch(),n=0;
      local[c].forEach(function(it){if(!have[it.id]&&n<450){bt.set(cloudCol(c).doc(it.id),clean(it));n++}});
      return n?bt.commit():null;
    });
  })).then(function(){lsSet(key,true)});
}
function startSync(){
  syncState='loading';
  var me=user;
  migrateLocal().catch(function(){}).then(function(){
    if(user!==me)return;
    COLS.forEach(function(c){
      unsubs.push(cloudCol(c).onSnapshot(function(snap){
        S[c]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
        save();syncState='on';render();if(form&&form.kind==='settings')drawSheetKeep();
      },function(){syncState='error';if(form&&form.kind==='settings')drawSheetKeep()}));
    });
  });
}
function initCloud(){
  if(!window.firebase||!firebase.auth||!firebase.firestore)return;
  try{
    firebase.initializeApp(FB_CFG);
    fsdb=firebase.firestore();
    try{fsdb.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    cloudReady=true;
    firebase.auth().getRedirectResult().catch(authErr);
    firebase.auth().onAuthStateChanged(function(u){
      unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];
      var was=user;user=u||null;
      if(user){if(!was)toast('로그인했어요. 폰과 PC가 연동돼요');emailOpen=false;startSync()}else syncState='off';
      render();if(form&&form.kind==='settings')drawSheetKeep();
    });
  }catch(e){}
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadFirebase(){
  var V='10.14.1',bases=['https://www.gstatic.com/firebasejs/'+V+'/','https://cdn.jsdelivr.net/npm/firebase@'+V+'/'];
  function tryBase(i){
    if(i>=bases.length)return Promise.reject();
    var B=bases[i];
    return loadScript(B+'firebase-app-compat.js').then(function(){return Promise.all([loadScript(B+'firebase-auth-compat.js'),loadScript(B+'firebase-firestore-compat.js')])}).catch(function(){return tryBase(i+1)});
  }
  tryBase(0).then(function(){initCloud();if(form&&form.kind==='settings')drawSheetKeep()}).catch(function(){});
}

(function boot(){
  var L=lsGet('mina-local',null);
  if(L&&typeof L==='object'){COLS.forEach(function(c){S[c]=Array.isArray(L[c])?L[c]:[]})}
  else{S=seed();save()}
  loaded=true;render();
  loadFirebase();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
  /* 자정이 지나면 날짜 갱신 */
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){var n=nowLocal(),t=iso(n.y,n.m,n.d);if(t!==TODAY)location.reload()}});
})();
})();
